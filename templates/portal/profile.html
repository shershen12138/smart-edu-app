{% extends "portal/base.html" %}
{% block content %}
  <div class="page-heading">
    <h1>个人中心</h1>
  </div>
  <section class="card form-card profile-card">
    <dl class="profile-list">
      <div class="profile-row">
        <dt>姓名</dt>
        <dd>{{ user.full_name }}</dd>
      </div>
      <div class="profile-row">
        <dt>登录名</dt>
        <dd>{{ user.username }}</dd>
      </div>
      <div class="profile-row">
        <dt>学号 / 工号</dt>
        <dd>{{ user.student_no|default:'—' }}</dd>
      </div>
    </dl>
    <p class="subtle">账号信息和班级由管理员维护。忘记密码时联系管理员，无需邮箱。</p>
    <div class="actions">
      <a class="button" href="{% url 'password' %}">修改我的密码</a>
      <a class="button secondary" href="{% url 'totp_setup' %}">双因素认证</a>
    </div>
  </section>
{% endblock %}
