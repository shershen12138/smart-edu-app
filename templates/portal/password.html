{% extends "portal/base.html" %}
{% block content %}
  <div class="page-heading">
    <h1>{{ title }}</h1>
  </div>
  <section class="card form-card profile-card">
    <form method="post">
      {% csrf_token %}{{ form.as_p }}
      <div class="actions">
        <button class="button">保存</button>
        <a class="button secondary" href="{{ back_url }}">取消并返回</a>
      </div>
    </form>
    <p class="subtle password-hint">首次使用需要设置新密码。忘记密码时请联系管理员核验身份后重置。</p>
  </section>
{% endblock %}
