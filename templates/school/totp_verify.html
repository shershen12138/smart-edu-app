{% extends shell_template|default:"portal/base.html" %}
{% block content %}
  <div class="login-layout">
    <section class="login-story">
      <div class="eyebrow">COURSE / CODE / GROW</div>
      <div class="login-brand">课码</div>
      <h1>
        第二步，
        <br>
        确认是你本人。
      </h1>
      <p>
        除密码外，再输入一次动态口令。
        <br>
        即使密码泄露，账号也不会被直接登录。
      </p>
    </section>
    <section class="card login-card">
      <span class="brand-mark">2FA</span>
      <h2>动态口令验证</h2>
      <p class="subtle">请输入验证器中的 6 位动态口令，或使用一个一次性恢复码。</p>
      <form method="post">
        {% csrf_token %}
        <label>
          动态口令 / 恢复码
          <input name="code"
                 inputmode="numeric"
                 autocomplete="one-time-code"
                 autofocus
                 required>
        </label>
        <button class="button full">验证并进入 →</button>
      </form>
      <p class="help">
        验证器时间需与服务器一致；连续错误 5 次需要重新登录。
        <br>
        <a href="{% url 'login' %}">返回重新登录</a>
      </p>
    </section>
  </div>
{% endblock %}
