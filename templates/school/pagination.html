{% if page.has_other_pages %}
  <div class="pagination">
    {% if page.has_previous %}
      <a href="?page={{ page.previous_page_number }}&q={{ query|urlencode }}">← 上一页</a>
    {% endif %}
    <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a href="?page={{ page.next_page_number }}&q={{ query|urlencode }}">下一页 →</a>
    {% endif %}
  </div>
{% endif %}
