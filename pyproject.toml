[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".document_work", ".runtime", "school/migrations"]

[tool.ruff.format]
quote-style = "single"

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100
format_css = true
format_js = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "F401"]